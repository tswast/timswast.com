    <script type="module">
        import * as THREE from '/static/three-r174/three.module.min.js';
        import { OBJLoader } from '/static/three-r174/OBJLoader.js';
        import { MTLLoader } from '/static/three-r174/MTLLoader.js';
        import { OrbitControls } from '/static/three-r174/OrbitControls.js'; //for debugging purpose

     // create a new scene
     const scene = new THREE.Scene();
        // create a new perspective camera
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        // create a new WebGL renderer
        const renderer = new THREE.WebGLRenderer();
        // set the size of the renderer
        renderer.setSize(100, 100);
        // renderer.setSize(window.innerWidth, window.innerHeight);
        // add the renderer to the DOM
        document.body.appendChild(renderer.domElement);

        //=======LIGHTS=======//
        // add an ambient light to the scene. Ambient light globally illuminates all objects in the scene equally.
        const ambientLight = new THREE.AmbientLight(0x404040); // soft white light
        scene.add(ambientLight);
        // add a directional light to the scene. A directional light illuminates in a specific direction like the sun.
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        // move the light to x:1, y:1, z:1
        directionalLight.position.set(100, 100, 50);
        scene.add(directionalLight);

        //=======Loading the Model=======//
        // create a new material loader
        const mtlLoader = new MTLLoader();
        // load the mtl file
        mtlLoader.load('pencil.mtl', (materials) => {
            materials.preload();
            const objLoader = new OBJLoader();
            objLoader.setMaterials(materials);
            objLoader.load('pencil.obj', (object) => {

                        // 1. Calculate the bounding box of the *entire* object
                        const boundingBox = new THREE.Box3().setFromObject(object);
                        const center = boundingBox.getCenter(new THREE.Vector3());

                        // 2. Store the object's *initial* position
                        const initialPosition = object.position.clone();

                        // 3. Translate the object so that its center is at the world origin
                        object.position.sub(center);

                        // 4. Add a dummy parent
                        const dummy = new THREE.Group();
                        dummy.add(object);
                        scene.add(dummy);

                        // 5.  Restore the parent's position
                        dummy.position.copy(center);

                        // 6.  Rotate the dummy
                        let loadedModel = dummy;

                        // Add the model to the scene
                        scene.add(dummy);

                        // Adjust the camera position
                        camera.position.z = 20;

                        // Rotate the model
                        function animate() {
                            requestAnimationFrame(animate);
                            if (loadedModel) {
                                loadedModel.rotation.y += 0.01;
                            }
                            renderer.render(scene, camera);
                        }
                        animate();

                        // Add some controls to the camera
                        const controls = new OrbitControls(camera, renderer.domElement);
                        controls.enableDamping = true;
                        controls.dampingFactor = 0.25;
                        controls.screenSpacePanning = false;
                        controls.maxPolarAngle = Math.PI / 2;
                    },
                    (xhr) => {
                        console.log((xhr.loaded / xhr.total * 100) + '% loaded');
                    },
                    (error) => {
                        console.error('An error happened', error);
                    }
                );
            },
            (xhr) => {
                console.log((xhr.loaded / xhr.total * 100) + '% loaded');
            },
            (error) => {
                console.error('An error happened while loading the MTL file:', error);
            }
        );

        // Make the scene responsive
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, false);
    </script>
